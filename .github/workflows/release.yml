# 打 tag v* 或手动触发：构建 Windows / macOS / Linux 安装包并发布 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/ci-audit.mjs

  build-win:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Export icon
        run: npm run icon:export

      - name: Build app
        run: npm run build

      - name: Clean dist
        run: if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Package (NSIS + Portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-win-${{ github.ref_name }}
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe
            dist/*.blockmap
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Export icon
        run: npm run icon:export

      - name: Build app
        run: npm run build

      - name: Clean dist
        run: rm -rf dist

      - name: Detect macOS signing credentials
        id: mac_signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing mode: signed + notarized"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing credentials are missing or incomplete; publishing unsigned macOS artifacts"
          fi

      - name: Package signed macOS
        if: steps.mac_signing.outputs.enabled == 'true'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package unsigned macOS
        if: steps.mac_signing.outputs.enabled != 'true'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Remove App Store Connect private key
        if: always() && steps.mac_signing.outputs.enabled == 'true'
        run: rm -f "$APPLE_API_KEY"

      - name: Verify signed macOS Gatekeeper acceptance
        if: steps.mac_signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          : "${dmg_path:?DMG artifact missing}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          : "${app_path:?App bundle missing from DMG}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-mac-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Export icon
        run: npm run icon:export

      - name: Build app
        run: npm run build

      - name: Clean dist
        run: rm -rf dist

      - name: Package (AppImage + deb)
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-linux-${{ github.ref_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [dependency-audit, build-win, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pi-desktop-*
          merge-multiple: true

      - name: Prepare release assets (no auto-update metadata)
        run: |
          find release-assets -type f \( -name 'latest.yml' -o -name 'latest-mac.yml' -o -name 'latest-linux.yml' \) -delete
          find release-assets -type f | sort

      - name: Generate SBOM
        run: node scripts/generate-release-sbom.mjs release-assets/sbom.cdx.json

      - name: Generate SHA256SUMS.txt
        run: node scripts/generate-release-checksums.mjs release-assets

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/**

      # Release body = 用户可读更新说明（应用内弹窗展示）。禁止仅放 CHANGELOG 链接占位。
      - name: Draft release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if ! node scripts/generate-release-notes.mjs "$VER" > release-body.md; then
            echo "::error::CHANGELOG.md missing section for ${VER}. Add user-facing notes before tagging."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::Generated release body is empty"
            exit 1
          fi
          echo "Release body preview:"
          head -n 60 release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
