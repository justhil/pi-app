# 打 tag v* 或手动触发：构建 Windows / macOS / Linux 安装包和 Android APK，打 tag 时发布 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/ci-audit.mjs

  build-win:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Export icon
        run: npm run icon:export

      - name: Build app
        run: npm run build

      - name: Clean dist
        run: if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Package (NSIS + Portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-win-${{ github.ref_name }}
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe
            dist/*.blockmap
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Export icon
        run: npm run icon:export

      # One runner packages both arches: npm only installed this machine's pty binary.
      - name: Add the other macOS pty binary
        run: |
          set -euo pipefail
          ver="$(node -p "require('@lydell/node-pty/package.json').version")"
          npm install --no-save --force "@lydell/node-pty-darwin-x64@$ver" "@lydell/node-pty-darwin-arm64@$ver"
          ls node_modules/@lydell

      - name: Build app
        run: npm run build

      - name: Clean dist
        run: rm -rf dist

      - name: Detect macOS signing credentials
        id: mac_signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing mode: signed + notarized"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing credentials are missing or incomplete; publishing unsigned macOS artifacts"
          fi

      - name: Package signed macOS
        if: steps.mac_signing.outputs.enabled == 'true'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package unsigned macOS
        if: steps.mac_signing.outputs.enabled != 'true'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Remove App Store Connect private key
        if: always() && steps.mac_signing.outputs.enabled == 'true'
        run: rm -f "$APPLE_API_KEY"

      - name: Verify signed macOS Gatekeeper acceptance
        if: steps.mac_signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          : "${dmg_path:?DMG artifact missing}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          : "${app_path:?App bundle missing from DMG}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-mac-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Export icon
        run: npm run icon:export

      - name: Build app
        run: npm run build

      - name: Clean dist
        run: rm -rf dist

      - name: Package (AppImage + deb)
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-linux-${{ github.ref_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tag builds must be release-signed; manual runs without the secrets fall back to the debug key.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            ks="$RUNNER_TEMP/pi-remote-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
            echo "ANDROID_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK"
            exit 1
          else
            echo "::warning::Android signing secrets missing; building a debug-signed APK"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "PI_REQUIRE_RELEASE_SIGNING=1" >> "$GITHUB_ENV"; fi

      - name: Build APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Name and verify APK
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          mkdir -p dist-android
          out="dist-android/pi-remote-${ver}-android-arm64.apk"
          cp apps/mobile/androidApp/build/outputs/apk/release/androidApp-release.apk "$out"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$out" | grep -E 'DN|SHA-256'
          ls -la dist-android

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pi-remote-release.jks"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-android-${{ github.ref_name }}
          path: dist-android/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [dependency-audit, build-win, build-mac, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pi-desktop-*
          merge-multiple: true

      - name: Prepare release assets (no auto-update metadata)
        run: |
          find release-assets -type f \( -name 'latest.yml' -o -name 'latest-mac.yml' -o -name 'latest-linux.yml' \) -delete
          find release-assets -type f | sort

      - name: Generate SBOM
        run: node scripts/generate-release-sbom.mjs release-assets/sbom.cdx.json

      - name: Generate SHA256SUMS.txt
        run: node scripts/generate-release-checksums.mjs release-assets

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/**

      # Release body = 用户可读更新说明（应用内弹窗展示）。禁止仅放 CHANGELOG 链接占位。
      - name: Draft release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if ! node scripts/generate-release-notes.mjs "$VER" > release-body.md; then
            echo "::error::CHANGELOG.md missing section for ${VER}. Add user-facing notes before tagging."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::Generated release body is empty"
            exit 1
          fi
          echo "Release body preview:"
          head -n 60 release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
